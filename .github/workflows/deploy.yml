name: Deploy Cafe Gopala Website

# Push to main -> copy the static site to the Hetzner server and reload nginx.
# Reuses the SAME server + SSH secrets as the care-ai / guhya-website repos:
#   UK_SERVER_IP, SSH_USER, SSH_PRIVATE_KEY
# Add these under: GitHub repo -> Settings -> Secrets and variables -> Actions.
#
# One-time prerequisite (done once, see DEPLOY-cafegopala.md):
#   - cafegopala.in DNS points at the server
#   - /home/deploy/careai/sites/cafegopala.in exists (created by avyangah-infra server/add-site.sh)
#   - the nginx block for cafegopala.in is live + a TLS cert is in place
#     (owned by the avyangah-infra repo: apps/cafegopala.in.app, rendered by
#      bin/render.sh and deployed with bin/deploy.sh. No nginx config lives here.)

on:
  push:
    branches: [main]
  workflow_dispatch:   # lets you trigger a deploy manually from the Actions tab

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repo keeps the HTML in pages/ for tidiness, but the site is served
      # FLAT: pages/index.html -> <root>/index.html. strip_components: 1 drops the
      # leading "pages/" so the live URLs stay /, /order.html, ... and no nginx
      # change is needed. Everything else keeps its path.
      - name: Upload pages (flattened to site root)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UK_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "pages/*"
          strip_components: 1
          target: "/home/deploy/careai/sites/cafegopala.in"
          overwrite: true

      - name: Upload assets and site metadata
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UK_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "images/,videos/,data/,manifest.json,robots.txt,sitemap.xml"
          target: "/home/deploy/careai/sites/cafegopala.in"
          overwrite: true

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UK_SERVER_IP }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            docker exec careai-nginx nginx -t
            docker exec careai-nginx nginx -s reload
            echo "Cafe Gopala site deployed and nginx reloaded"
