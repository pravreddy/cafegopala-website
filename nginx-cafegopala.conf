# =============================================================
# Cafe Gopala — static marketing site (cafegopal.co.in)
# Drop-in alongside Care AI + SignSimple + Guhya, behind the same
# careai-nginx container. Independent: own domain, own cert,
# no container, no DB. Does not affect the other sites.
#
# The POS (pos.cafegopal.co.in) is served separately by the
# guhya-pos stack — this file only serves the marketing site.
# =============================================================

# --- HTTP -> HTTPS (with ACME exception for Let's Encrypt) ---
server {
    listen 80;
    server_name cafegopal.co.in www.cafegopal.co.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: serve the static site ---
server {
    listen 443 ssl;
    http2 on;
    server_name cafegopal.co.in www.cafegopal.co.in;

    ssl_certificate     /etc/nginx/ssl/cafegopal-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cafegopal-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GopalaSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root  /usr/share/nginx/cafegopal;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
