# ⚠ SUPERSEDED (19 Aug 2026) — DO NOT INSTALL THIS FILE.
# The live nginx block for cafegopala.in is rendered and published by
# avyangah-infra (apps/cafegopala.in.app, NOT_FOUND=404) with validation and
# rollback. This copy is kept only as a readable reference for what the
# rendered config should amount to. If they disagree, the manifest wins.
#
# =============================================================
# Cafe Gopala — static marketing site (cafegopala.in)
# Drop-in alongside Care AI + SignSimple + Guhya, behind the same
# careai-nginx container. Independent: own domain, own cert,
# no container, no DB. Does not affect the other sites.
#
# The POS (pos.cafegopala.in) is served separately by the
# guhya-pos stack — this file only serves the marketing site.
# =============================================================

# --- HTTP -> HTTPS (with ACME exception for Let's Encrypt) ---
server {
    listen 80;
    server_name cafegopala.in www.cafegopala.in;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS: serve the static site ---
server {
    listen 443 ssl;
    http2 on;
    server_name cafegopala.in www.cafegopala.in;

    ssl_certificate     /etc/nginx/ssl/cafegopala.in-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/cafegopala.in-privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:GopalaSSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    root  /usr/share/nginx/cafegopal;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # A MULTI-PAGE static site, not a single-page app. The old rule fell back to
    # /index.html for anything unknown, which answered 200 OK with the homepage
    # at every mistyped URL — a "soft 404". Search engines read that as the same
    # page existing at endless addresses, and it costs ranking rather than
    # saving a visitor. Answer honestly and show a way back instead.
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }

    # Fingerprint-free filenames, so a long cache would strand people on an old
    # logo. A week is enough to help repeat visitors without that risk.
    location ~* \.(?:webp|png|jpe?g|mp4|webm|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/html application/javascript application/json
               application/xml image/svg+xml;
}
